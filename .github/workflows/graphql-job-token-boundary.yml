name: H1 owned GraphQL job token boundary
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Compare ordinary and protected writes
        shell: bash
        run: |
          node <<'NODE'
          const repo = 'broodkiller-2/h1-reusable-host-20261124'
          const root = 'h1-graphql-token-control-20261128.txt'
          const lock = '.github/workflows/actions.lock'
          const marker = 'H1_GRAPHQL_JOB_TOKEN_CONTROL_20261128\n'
          const lockBytes = "version: 'v0.0.3'\nworkflows: {}\ndependencies: {}\n"
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2026-03-10',
            'User-Agent': 'owned-h1-graphql-boundary',
          }
          const query = 'mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}'

          async function get(path) {
            const response = await fetch(`https://api.github.com/repos/${repo}/${path}`, { headers })
            const body = await response.json().catch(() => ({}))
            return { status: response.status, body }
          }
          async function commit(head, change, label) {
            const input = {
              branch: { repositoryNameWithOwner: repo, branchName: 'main' },
              expectedHeadOid: head,
              fileChanges: change,
              message: { headline: `H1 owned GraphQL job-token ${label}` },
            }
            const response = await fetch('https://api.github.com/graphql', {
              method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, variables: { input } }),
            })
            const body = await response.json().catch(() => ({}))
            const oid = body.data?.createCommitOnBranch?.commit?.oid ?? null
            return {
              status: response.status, oid,
              errorTypes: (body.errors ?? []).map(e => e.type ?? 'UNKNOWN').slice(0, 3),
              errorMessages: (body.errors ?? []).map(e => String(e.message ?? '').replace(/(github_pat_|gh[psuor]_)[A-Za-z0-9_]+/g, '[redacted]').slice(0, 180)).slice(0, 3),
            }
          }
          async function exactRead(path, expected) {
            const result = await get(`contents/${path}?ref=main`)
            if (result.status !== 200 || !result.body.content) return { status: result.status, matches: false }
            return { status: result.status, matches: Buffer.from(result.body.content, 'base64').toString() === expected }
          }
          const add = (path, content) => ({ additions: [{ path, contents: Buffer.from(content).toString('base64') }] })
          const del = path => ({ deletions: [{ path }] })

          ;(async () => {
            const beforeRoot = await get(`contents/${root}?ref=main`)
            const beforeLock = await get(`contents/${lock}?ref=main`)
            const ref = await get('git/ref/heads/main')
            console.log(JSON.stringify({ preflight: { root: beforeRoot.status, lock: beforeLock.status, ref: ref.status } }))
            if (beforeRoot.status !== 404 || beforeLock.status !== 404 || ref.status !== 200 || !ref.body.object?.sha) return

            const rootWrite = await commit(ref.body.object.sha, add(root, marker), 'root create')
            console.log(JSON.stringify({ rootWrite: { status: rootWrite.status, created: !!rootWrite.oid, errorTypes: rootWrite.errorTypes, errorMessages: rootWrite.errorMessages } }))
            if (!rootWrite.oid) return
            const rootRead = await exactRead(root, marker)
            console.log(JSON.stringify({ rootRead }))
            const rootDelete = await commit(rootWrite.oid, del(root), 'root remove')
            console.log(JSON.stringify({ rootDelete: { status: rootDelete.status, removed: !!rootDelete.oid, errorTypes: rootDelete.errorTypes } }))
            if (!rootRead.matches || !rootDelete.oid) return

            const lockWrite = await commit(rootDelete.oid, add(lock, lockBytes), 'lockfile create')
            console.log(JSON.stringify({ lockWrite: { status: lockWrite.status, created: !!lockWrite.oid, errorTypes: lockWrite.errorTypes } }))
            if (!lockWrite.oid) return
            const lockRead = await exactRead(lock, lockBytes)
            console.log(JSON.stringify({ lockRead }))
            const lockDelete = await commit(lockWrite.oid, del(lock), 'lockfile remove')
            console.log(JSON.stringify({ lockDelete: { status: lockDelete.status, removed: !!lockDelete.oid, errorTypes: lockDelete.errorTypes } }))
          })().catch(error => {
            console.log(JSON.stringify({ probeError: error.name }))
            process.exitCode = 1
          })
          NODE
