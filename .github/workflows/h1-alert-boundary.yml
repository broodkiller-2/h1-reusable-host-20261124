name: Owned Dependabot alert permission boundary
on:
  workflow_dispatch:

jobs:
  read_allowed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      vulnerability-alerts: read
    steps:
      - name: Read exact owned alert
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const url = 'https://api.github.com/repos/broodkiller-2/h1-reusable-host-20261124/dependabot/alerts/1';
          fetch(url, {headers: {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2026-03-10',
          }}).then(async response => {
            const data = await response.json().catch(() => ({}));
            console.log(`alert_boundary role=read status=${response.status} exact_alert=${data.number === 1 ? 1 : 0}`);
          }).catch(error => { console.error(`alert_boundary role=read error=${error.name}`); process.exitCode = 1; });
          NODE

  read_denied:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      vulnerability-alerts: none
    steps:
      - name: Attempt exact owned alert read
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const url = 'https://api.github.com/repos/broodkiller-2/h1-reusable-host-20261124/dependabot/alerts/1';
          fetch(url, {headers: {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2026-03-10',
          }}).then(async response => {
            const data = await response.json().catch(() => ({}));
            console.log(`alert_boundary role=none status=${response.status} exact_alert=${data.number === 1 ? 1 : 0}`);
          }).catch(error => { console.error(`alert_boundary role=none error=${error.name}`); process.exitCode = 1; });
          NODE
