name: H1 owned direct artifact preview control
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Create harmless HTML marker
        run: |
          cat > preview.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Owned artifact preview control</title>
          <p>h1-owned-artifact-preview-20261125</p>
          <script>document.documentElement.dataset.h1Origin = location.origin</script>
          HTML
      - name: Upload one direct HTML file
        uses: actions/upload-artifact@v7
        with:
          path: preview.html
          archive: false
          retention-days: 1
